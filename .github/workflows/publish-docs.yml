name: Publish docs

# Builds the SDK reference on every pull request. A push to dev publishes it to the dev apidocs
# site as a preview. Prod publishes after Test succeeds on main, from main's head.
#
# The publishing roles trust only this file, on dev or main, so keep its path and never add a
# workflow_call trigger. The role, bucket and distribution are secrets so the run logs mask them:
# repository secrets for dev, and the release environment's for prod.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build the reference
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.6.x"

      - name: Build
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv sync --locked
          uv run python tools/gendocs/gendocs.py -o site --version "preview of ${SHA::7}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 7

  # Trusted by the dev role through the branch alone, so it declares no environment.
  publish-dev:
    name: Publish to dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-docs-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - uses: ./.github/actions/publish-docs
        with:
          site: site
          role-to-assume: ${{ secrets.DOCS_DEV_ROLE_ARN }}
          bucket: ${{ secrets.DOCS_DEV_BUCKET }}
          distribution-id: ${{ secrets.DOCS_DEV_DISTRIBUTION_ID }}

  # The prod role trusts only the release environment. workflow_run's branches filter matches
  # the head branch's name alone, so a fork's branch named main is ruled out here. Only the run
  # for main's head publishes, so a run for an older merge that finishes late can't roll the
  # site back.
  publish-prod:
    name: Publish to prod
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-docs-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check this run is for main's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on from ${SHA::7}; its head's run publishes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.head.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: steps.head.outputs.publish == 'true'
        with:
          version: "0.6.x"
          # No cache: the prod role is in reach, so nothing restored from a cache another
          # workflow could have written.
          enable-cache: false

      - name: Build
        if: steps.head.outputs.publish == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          uv sync --locked
          uv run python tools/gendocs/gendocs.py -o site --version "main at ${SHA::7}"

      - uses: ./.github/actions/publish-docs
        if: steps.head.outputs.publish == 'true'
        with:
          site: site
          role-to-assume: ${{ secrets.DOCS_PROD_ROLE_ARN }}
          bucket: ${{ secrets.DOCS_PROD_BUCKET }}
          distribution-id: ${{ secrets.DOCS_PROD_DISTRIBUTION_ID }}
