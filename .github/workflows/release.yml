name: Release

# Every merge to main is a release. After Test succeeds on main, this tags the merge commit
# v<base>.<n>, publishes that version of pycarlo2 to PyPI and attaches the same files to a GitHub
# release. A manual run, from any branch, is a dry run: it publishes a dev version to TestPyPI and
# tags nothing.
#
# PyPI's Trusted Publisher names this file and the release environment, so keep its path, keep
# publish-pypi here, and never add a workflow_call trigger. The release environment allows only
# main; the prod docs role relies on that too.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # workflow_run's branches filter matches the head branch's name alone, so a fork's branch named
  # main is ruled out here.
  tag:
    name: Tag the release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # One run at a time, so two quick merges cannot pick the same tag. A run still waiting here is
    # replaced by a newer one, whose release then covers both merges.
    concurrency:
      group: tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the tag
        id: next
        run: |
          tag=$(.github/scripts/next-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::This commit, or a later one, is already released; nothing to release."
          fi

      # Tag creation is restricted to the org App and the `apollo` team by a ruleset, and tags are
      # immutable.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: token
        if: steps.next.outputs.tag != ''
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}
          owner: monte-carlo-data
          repositories: mc-sdk-python
          permission-contents: write

      - name: Tag ${{ steps.next.outputs.tag }}
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.next.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          echo "Tagged $SHA as $TAG."

  # Builds without id-token, so nothing that runs during the build can mint a publishing token.
  # Every condition below names the jobs it depends on. The implicit success() would skip all of
  # them on a manual run, where tag is skipped, and a failed tag must never let a version publish.
  build:
    name: Build
    needs: tag
    if: >-
      ${{ !cancelled() && (
      (needs.tag.result == 'success' && needs.tag.outputs.tag != '') ||
      github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A dry run takes the next release's version, or the current one when HEAD is already
      # released, as a dev release, so it never takes a number a real release needs, even on
      # TestPyPI.
      - name: Work out the version
        id: version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag=$(.github/scripts/next-tag.sh)
            [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
            TAG="$tag.dev$GITHUB_RUN_ID"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.6.x"
          # No cache: nothing restored from a cache another workflow could have written.
          enable-cache: false

      - name: Build and check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/build-dist.sh "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      # smoke and github-release run the build's copies, so neither job checks anything out.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scripts
          path: |
            .github/scripts/smoke.py
            .github/scripts/github-release.sh
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [tag, build]
    if: >-
      ${{ !cancelled() &&
      github.event_name == 'workflow_run' &&
      needs.tag.result == 'success' &&
      needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # skip-existing lets "Re-run failed jobs" finish an upload that stopped halfway; smoke still
      # checks that every file PyPI serves is the one built.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # No environment, so a dry run works from any branch. TestPyPI's publisher names no
  # environment; PyPI's names release, so this job could never publish there.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: >-
      ${{ !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # Installs what the index now serves and runs the build's smoke.py on it, outside any checkout.
  # Dependencies come from PyPI even for TestPyPI, where anyone can upload a package under a
  # dependency's name.
  smoke:
    name: Install from ${{ github.event_name == 'workflow_dispatch' && 'TestPyPI' || 'PyPI' }}
    needs: [build, publish-pypi, publish-testpypi]
    if: >-
      !cancelled() && (
      needs.publish-pypi.result == 'success' ||
      needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    env:
      INDEX: ${{ github.event_name == 'workflow_dispatch' && 'test.pypi.org' || 'pypi.org' }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-scripts
          path: scripts

      - name: The index serves the files this run built
        run: |
          python3 -I - <<'EOF'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request

          url = f"https://{os.environ['INDEX']}/pypi/pycarlo2/{os.environ['VERSION']}/json"
          built = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("dist").glob("pycarlo2-*")}
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(url) as r:
                      served = {f["filename"]: f["digests"]["sha256"] for f in json.load(r)["urls"]}
                  if served == built:
                      break
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              time.sleep(15)
          else:
              raise SystemExit(f"{url} never served exactly {sorted(built)}")
          print(f"{url} serves {sorted(built)}")
          EOF

      - name: Install and build a client
        run: |
          python3 -m venv venv
          venv/bin/pip download --no-deps --only-binary :all: -d served \
            --index-url "https://$INDEX/simple/" "pycarlo2==$VERSION"
          venv/bin/pip install served/*.whl
          venv/bin/python -I scripts/smoke.py "$VERSION"

  # Attaches the files PyPI now serves to a GitHub release on the tag, once smoke has checked them.
  # Only the highest version is marked latest, since releases from back-to-back merges can finish
  # out of order. A rerun leaves a published release alone and replaces a draft an interrupted run
  # left; anyone else's draft fails the run.
  github-release:
    name: Create the GitHub release
    needs: [tag, build, smoke]
    if: >-
      ${{ !cancelled() &&
      github.event_name == 'workflow_run' &&
      needs.tag.result == 'success' &&
      needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release with GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-scripts
          path: scripts

      - name: Create ${{ needs.tag.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/github-release.sh "$TAG" "$VERSION" dist
